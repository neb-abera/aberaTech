<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/lighthouse-planted.css" />
    <!-- The SVG is the source and picks its colour from the browser theme.
         The PNGs are the same file rasterised, one per theme, for anything
         that will not take an SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neb Abera</title>
    <!--
      Set by AppTheme for one tick while the colour scheme changes, so the
      switch repaints at once. It beats the transitions MUI sets inline, as
      MUI's own rule does. Inline here because a stylesheet link for 51
      bytes held first paint for a whole request. The CSP allows it by the
      hash of its text (CspInlineStyles.cs).
    -->
    <style>
      /* biome-ignore lint/complexity/noImportantStyles: it has to beat the transitions MUI sets inline */
      html.scheme-switching * { transition: none !important; }
    </style>
    <!--
      Prefetch pages when a link looks likely to be used (hover/press), so
      navigating between the prerendered pages is near-instant. The API routes
      are excluded: speculating a GET against the scheduling API would be a
      real request with real rate-limit budget. The CSP covers this inline
      script automatically - hashes are computed from the shipped HTML at
      startup.
    -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/api/*" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
