<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The SVG is the source; favicon-96.png is the same file rasterised for
         anything that will not take an SVG. The old icon was a light grey
         glyph on transparent and vanished on a light tab strip. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neb Abera</title>
    <!--
      Prefetch pages when a link looks likely to be used (hover/press), so
      navigating between the prerendered pages is near-instant. The API routes
      are excluded: speculating a GET against the scheduling API would be a
      real request with real rate-limit budget. The CSP covers this inline
      script automatically - hashes are computed from the shipped HTML at
      startup.
    -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/api/*" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
