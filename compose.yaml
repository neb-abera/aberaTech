# Every way of working on the client runs in a container, so nothing but Docker
# needs to be installed on the machine.
#
#   make up      the whole site and its database on http://localhost:8080
#   make dev     hot reloading dev server on http://localhost:3000
#   make test    client unit tests against the working tree
#   make servertest  scheduling unit tests against the working tree
#   make lint    eslint and prettier against the working tree
#   make check   the hermetic gate CI runs, built from the Dockerfile alone
#
# The services below mount the working tree, so they see uncommitted edits and
# give a fast loop. `make check` deliberately does not: it builds the clienttest
# and clientlint stages, which copy the tree into the image, so it measures what
# a reviewer would actually get.
name: aberatech

services:
  dev:
    build:
      context: .
      dockerfile: aberaTech.Server/Dockerfile
      target: clientdev
    ports:
      # Bound to the loopback interface deliberately. A published port defaults
      # to 0.0.0.0, which puts the dev server on every interface this machine
      # has; the vite advisories that keep appearing are precisely "any website
      # can reach the dev server" and "server.fs.deny can be bypassed for files
      # under the project root". There is no reason for it to leave the host.
      - '127.0.0.1:3000:3000'
    volumes:
      # Edits on the host reload in the container.
      - ./aberatech.client:/client
      # The host has no node_modules, and the bind mount above would hide the
      # image's. This anonymous volume keeps the image's tree visible at that
      # path. Remove it with `make clean` after changing dependencies.
      - /client/node_modules
    environment:
      IN_DOCKER: 'true'

  test:
    build:
      context: .
      dockerfile: aberaTech.Server/Dockerfile
      target: clientbase
    volumes:
      - ./aberatech.client:/client
      - /client/node_modules
    environment:
      IN_DOCKER: 'true'
    command: ['npm', 'run', 'test']

  # Targets clienttools rather than clientlint on purpose: clientlint runs the
  # check as a build step, so building it to rewrite badly formatted files would
  # fail before the container ever started.
  lint:
    build:
      context: .
      dockerfile: aberaTech.Server/Dockerfile
      target: clienttools
    volumes:
      - .:/repo
      - /repo/node_modules
    command: ['sh', '-c', 'npx eslint . && npx prettier --check .']

  # Postgres for the scheduling feature.
  #
  # Chosen over any other store for two things the scheduler leans on directly:
  # SELECT ... FOR UPDATE SKIP LOCKED, which is how the outbox dispatcher claims
  # work without two replicas either double sending or blocking each other, and
  # btree_gist exclusion constraints, which let the database itself refuse
  # overlapping appointments rather than trusting application code to win a race
  # it cannot see.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scheduling
      POSTGRES_PASSWORD: scheduling
      POSTGRES_DB: scheduling
    ports:
      # Loopback only, for the same reason the dev server is: a published port
      # defaults to every interface, and a development database with a known
      # password does not belong on the network.
      #
      # 5433 rather than the default 5432, because this machine runs several
      # projects at once and the default is the one they all reach for first.
      # The server container talks to db:5432 on the compose network regardless;
      # this mapping exists only so a database tool on the host can connect.
      - '127.0.0.1:5433:5432'
    volumes:
      - scheduling-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduling -d scheduling']
      interval: 5s
      timeout: 3s
      retries: 10

  # Scheduling unit tests against the working tree, for the same fast loop the
  # client tests get. `make check` builds the hermetic servertest stage instead.
  servertest:
    build:
      context: .
      dockerfile: aberaTech.Server/Dockerfile
      target: build
    volumes:
      - .:/src
    working_dir: /src
    command: ['dotnet', 'test', 'aberaTech.Server.Tests/aberaTech.Server.Tests.csproj', '--nologo']

  # The whole site as it is deployed — .NET server, built client, database —
  # for trying a change the way a visitor meets it rather than through the vite
  # dev server, which serves the client alone and has no API behind it.
  app:
    build:
      context: .
      dockerfile: aberaTech.Server/Dockerfile
      args:
        IN_DOCKER: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      # Development so the availability rules seed themselves and a fresh
      # database produces a page with slots on it rather than an empty state
      # that looks like a bug.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Scheduling: 'Host=db;Port=5432;Database=scheduling;Username=scheduling;Password=scheduling'
      # Reminder leads, overridable so a reminder can be watched firing in
      # minutes rather than an hour:
      #
      #   REMINDER_LEAD_MINUTES=2 BOOKING_LEAD_MINUTES=1 make up
      #
      # then book the first slot offered and watch `docker compose logs -f app`
      # for the send two minutes before it starts. Defaults match production.
      Scheduling__ReminderLeadMinutes: '${REMINDER_LEAD_MINUTES:-60}'
      Scheduling__EarlyReminderLeadMinutes: '${EARLY_REMINDER_LEAD_MINUTES:-1440}'
      Scheduling__BookingLeadMinutes: '${BOOKING_LEAD_MINUTES:-30}'
    depends_on:
      db:
        condition: service_healthy

volumes:
  scheduling-db:
