# Weekly dependency updates; security updates are enabled at the repo level.
#
# Patch and minor bumps arrive grouped — one PR per ecosystem per week instead
# of one per package — and the dependabot-automerge workflow merges those when
# CI is green. Majors are armed too: one that passes every check merges
# itself, and one that genuinely conflicts stays open and red - the human
# queue is the list of open red Dependabot PRs.
#
# Packages that must move together are grouped at every update level, majors
# included, or a major arrives as two PRs that each fail to install.
#
# The newest GA major of .NET and Node is taken, LTS or not. No ignore range
# holds a major back. scripts/check-newest-majors.sh fails on one, and when
# a site is 45 days behind the newest GA major.
version: 2

# The Playwright browser image and the @playwright/test runner must be one
# version (scripts/check-playwright-image.sh). They live in two ecosystems,
# so a group of either alone would bump one and leave the other behind, and
# each pull request would fail the check. This group bumps both in one.
multi-ecosystem-groups:
  playwright:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      nuget-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      npm-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # The client has its own manifest; an npm entry only scans its own
  # directory, so without this the React/MUI/Vite tree is never updated.
  - package-ecosystem: npm
    directory: /aberatech.client
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      # vitest and @vitest/* peer-depend on each other's exact version, so a
      # major split across two PRs cannot install in either (vitest 5, 2026-09:
      # #145 and #146 each failed npm ci and sat red). First match wins, so
      # this catches the pair before the non-major group does.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      client-npm-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # The end-to-end suite's own manifest: one dev dependency, @playwright/test,
  # bumped together with the browser image in e2e/Dockerfile.
  - package-ecosystem: npm
    directory: /e2e
    patterns: ["@playwright/test"]
    multi-ecosystem-group: playwright
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
  # Lighthouse CI and Lighthouse, run by `make lighthouse` in the Playwright
  # image (docs/lighthouse.md). One entry per manifest, in the `directory:`
  # form scripts/check-held-majors.sh reads.
  - package-ecosystem: npm
    directory: /tools/lighthouse
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      lighthouse-npm-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # The Lighthouse CI server's packages (tools/lhci-server/Dockerfile).
  - package-ecosystem: npm
    directory: /tools/lhci-server
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      lhci-server-npm-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # The browser image `make e2e` runs, pinned by digest in e2e/Dockerfile.
  - package-ecosystem: docker
    directory: /e2e
    patterns: ["mcr.microsoft.com/playwright"]
    multi-ecosystem-group: playwright
    cooldown:
      default-days: 5
  # The server's Dockerfile, the ZAP image the security scan runs
  # (.zap/Dockerfile, read by the workflow, never built), and the Lighthouse
  # CI server's Node image.
  - package-ecosystem: docker
    directories:
      - /aberaTech.Server
      - /.zap
      - /tools/lhci-server
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      docker-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # Image tags in compose.yaml (the dev postgres); the docker ecosystem
  # above only scans Dockerfiles.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      compose-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      actions-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
