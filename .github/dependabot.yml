# Weekly dependency updates; security updates are enabled at the repo level.
#
# Patch and minor bumps arrive grouped — one PR per ecosystem per week instead
# of one per package — and the dependabot-automerge workflow merges those when
# CI is green. Majors are armed too: one that passes every check merges
# itself, and one that genuinely conflicts stays open and red - the human
# queue is the list of open red Dependabot PRs.
#
# Packages that must move together are grouped at every update level, majors
# included, or a major arrives as two PRs that each fail to install.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      nuget-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      npm-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # The client has its own manifest; an npm entry only scans its own
  # directory, so without this the React/MUI/Vite tree is never updated.
  - package-ecosystem: npm
    directory: /aberatech.client
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    ignore:
      # jsdom 30.1.0 gives a focusout event a relatedTarget that MUI's
      # FocusTrap stores and then calls .focus() on, which it does not have:
      # "nodeToRestore.current.focus is not a function" fails every test that
      # unmounts an open Drawer or Menu (aberaTech #190, 2026-09-24). MUI
      # 9.4.0 is the newest and does not guard. Only this version is held, so
      # the next jsdom release is offered and CI says whether it is fixed.
      - dependency-name: jsdom
        versions: ["30.1.0"]
    groups:
      # vitest and @vitest/* peer-depend on each other's exact version, so a
      # major split across two PRs cannot install in either (vitest 5, 2026-09:
      # #145 and #146 each failed npm ci and sat red). First match wins, so
      # this catches the pair before the non-major group does.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      client-npm-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # The end-to-end suite's own manifest: one dev dependency, @playwright/test,
  # whose version also names the browser image `make e2e` runs (the Makefile
  # derives it from this file), so a bump here moves both together.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      e2e-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /aberaTech.Server
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      docker-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # Image tags in compose.yaml (the dev postgres); the docker ecosystem
  # above only scans Dockerfiles.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      compose-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release gets 5 days of other people finding its bugs and pulled
    # releases before it is offered here.
    cooldown:
      default-days: 5
    groups:
      actions-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
