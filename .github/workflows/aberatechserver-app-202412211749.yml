name: Build and deploy .NET application to container app aberatechserver-app-202412211749
# master is the production branch, and it is the only thing that deploys.
#
# This used to fire on dev as well. Both branches deployed to the same container
# app, so whichever pushed last was what abera.tech served: a change landing on
# the branch that happened to be behind would silently roll production back,
# with no failure to notice.
on:
  push:
    branches:
      - master
  # So a redeploy or a rollback does not require an empty commit.
  workflow_dispatch:

# Two merges minutes apart are two deploys of the same container app, and
# the second failed with ContainerAppOperationInProgress on 2026-09-18
# (#169). Queue them. Never cancel one: a cancelled deploy is half a rollout.
# The group holds one running and one pending run, and a third run replaces
# the pending one. That loses nothing. Runs queue in push order, so the run
# that replaces it is for a newer commit on master, which carries the
# replaced commit's changes. The newest commit always deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The token gets exactly what each job uses. The default here is read-only.
# The two jobs that sign in to Azure add id-token, which azure/login exchanges
# for Azure credentials through the app registration's federated credential,
# so no client secret is stored anywhere. The build job alone adds
# attestations, for the provenance and SBOM it signs. Without this block the
# workflow ran on the repository default, which is broader.
permissions:
  contents: read
env:
  CONTAINER_APP_CONTAINER_NAME: aberatechserver
  CONTAINER_APP_NAME: aberatechserver-app-202412211749
  CONTAINER_APP_RESOURCE_GROUP_NAME: aberatechserver-app-202412211749ResourceGroup
  CONTAINER_REGISTRY_LOGIN_SERVER: aberatechserver20241221175455.azurecr.io
  DOCKER_FILE_PATH: aberaTech.Server/Dockerfile
  PROJECT_NAME_FOR_DOCKER: aberatechserver
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      # The provenance and SBOM attestations on the pushed image.
      attestations: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds and pushes containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface
          # as refused raw-IP dials. Host-process jobs below are on block.
          egress-policy: audit

      # Step 1: Checkout the Repository
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2: Set up Docker Buildx
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Step 3: Log in to Azure, then to the registry with an Entra token.
      #
      # The registry's admin username and password are gone from this pipeline:
      # the same OIDC exchange the deploy job uses grants this job an identity,
      # and that identity holds AcrPush on the registry — a scoped, auditable
      # right, where the admin account was full push/pull for anyone holding a
      # password that never rotated. The token az acr login issues lives three
      # hours; this job needs it for minutes.
      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: az acr login --name "${CONTAINER_REGISTRY_LOGIN_SERVER%%.*}"

      # Step 4: Build and push Docker image to ACR
      - name: Build and Push Docker Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
          file: ${{ env.DOCKER_FILE_PATH }}

      # SLSA build provenance, pushed to the registry alongside the image:
      # anyone (including a future incident review) can verify the deployed
      # image was built by this workflow from this commit, with
      # `gh attestation verify`. Same machinery the template's releases use.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # SBOM of what actually shipped (the pushed image, not the source
      # tree), signed and pushed to the registry beside the image. A workflow
      # artifact expired after 90 days. The attestation lives as long as the
      # image and verifies with `gh attestation verify --predicate-type
      # https://spdx.dev/Document/v2.3`. actions/attest rather than
      # actions/attest-sbom, whose README deprecates it for this action.
      - name: Generate SBOM of the deployed image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM to the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # The schema changes here, before a revision of the new image exists, and
  # as abera-migrator: a user-assigned managed identity that owns the tables
  # in `scheduling` and `fitness`. The container app's own identity has DML
  # only and cannot run DDL, so this is the only place a migration can run.
  # A failure stops the workflow before `deploy`, and the previous revision
  # keeps serving on the schema it knows. Migrations stay backwards compatible
  # by one release, because that revision serves on the new schema until the
  # new one is ready. aberaTech.Postgres/Sql/README.md has the roles.
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job pulls and runs a container, and
          # container-side DNS bypasses harden-runner's resolver.
          egress-policy: audit

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The deploy identity pulls the image the build job pushed. The
      # migrator has no registry role, and needs none.
      - name: Azure Login, deploy identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_SUBSCRIPTION_ID }}

      - name: Pull the image this run pushed
        run: |
          az acr login --name "${CONTAINER_REGISTRY_LOGIN_SERVER%%.*}"
          docker pull "${CONTAINER_REGISTRY_LOGIN_SERVER}/${PROJECT_NAME_FOR_DOCKER}:${GITHUB_SHA}"

      # abera-migrator trusts this repository's master branch through a
      # federated credential, in both subject formats. It holds no Azure role,
      # so there is no subscription to select. Its one right is the Postgres
      # role of the same name.
      - name: Azure Login, migrator identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.DATABASE_MIGRATOR_CLIENT_ID }}
          tenant-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Pending migrations
        run: ./scripts/migrate-production.sh "${CONTAINER_REGISTRY_LOGIN_SERVER}/${PROJECT_NAME_FOR_DOCKER}:${GITHUB_SHA}" list

      - name: Apply migrations as abera-migrator
        run: ./scripts/migrate-production.sh "${CONTAINER_REGISTRY_LOGIN_SERVER}/${PROJECT_NAME_FOR_DOCKER}:${GITHUB_SHA}" apply

      - name: Logout from Azure
        if: always()
        run: az logout || true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: migrate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: the Azure CLI reaches a set of management and identity
          # hosts that changes with the CLI version. Read this job's audit
          # log before moving it to block with a list.
          egress-policy: audit

      # Step 5: Azure CLI Login with Federated Credentials
      - name: Azure Login
        # OIDC federation, like the Facewoof deploy: GitHub mints a short-lived
        # token attesting to this repository and branch, and the app
        # registration's federated credential accepts exactly that subject.
        # Nothing here is a secret — the client secret this replaced was a
        # two-year credential that anyone who could read it could use from
        # anywhere.
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_SUBSCRIPTION_ID }}

      # Step 6: Deploy the Container App with ACR Credentials
      - name: Deploy to Azure Container App
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            # Enable dynamic installation for Azure CLI extensions
            az config set extension.use_dynamic_install=yes_without_prompt

            # The app pulls with its own system-assigned managed identity
            # (AcrPull on the registry), configured once on the container app
            # rather than re-written with registry passwords on every deploy.

            # Update the Container App with the new Docker image
            az containerapp update --name ${{ env.CONTAINER_APP_NAME }} \
              --container-name ${{ env.CONTAINER_APP_CONTAINER_NAME }} \
              --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} \
              --image ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}

      # `az containerapp update` returns when Azure has accepted the new
      # revision, not when it is running. A revision that crashes on boot
      # leaves the previous one serving and the deploy still reports success —
      # which is how a broken release can look like a good one all the way to
      # the end of the log.
      - name: Wait for the new revision to run
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            set -uo pipefail
            az config set extension.use_dynamic_install=yes_without_prompt

            app="${{ env.CONTAINER_APP_NAME }}"
            group="${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }}"
            expected="${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}"

            # One scalar per query. A single tab-separated row loses its shape
            # the moment a field is empty, and every field here is empty for the
            # first few seconds of a revision's life.
            field() {
              az containerapp revision show --name "$app" --resource-group "$group" \
                --revision "$1" --query "$2" --output tsv 2>/dev/null || true
            }

            for attempt in $(seq 1 40); do
              name=$(az containerapp revision list --name "$app" --resource-group "$group" \
                --query "sort_by([?properties.active], &properties.createdTime)[-1].name" \
                --output tsv 2>/dev/null || true)

              if [ -z "$name" ]; then
                echo "attempt ${attempt}: no active revision yet"
                sleep 15
                continue
              fi

              state=$(field "$name" "properties.provisioningState")
              running=$(field "$name" "properties.runningState")
              image=$(field "$name" "properties.template.containers[0].image")

              echo "attempt ${attempt}: ${name} provisioning=${state:-?} running=${running:-?}"
              echo "  image=${image:-?}"

              # Unreadable is not wrong. A revision reports nothing at all for
              # its first few seconds, and failing on that reads a not-yet as a
              # mismatch — which is exactly how this step failed the first time
              # it ever ran, on a deploy that had in fact rolled correctly.
              if [ -n "$image" ] && [ "$image" != "$expected" ]; then
                echo "::error::Newest active revision runs ${image}, not the image this run pushed (${expected})."
                exit 1
              fi

              case "$state:$running" in
                Failed:* | *:Failed | *:Degraded | *:Stopped)
                  echo "::error::Revision ${name} is ${state}/${running}."
                  az containerapp logs show --name "$app" --resource-group "$group" \
                    --revision "$name" --tail 60 --type console || true
                  exit 1
                  ;;
              esac

              # Provisioned plus the right image is the health signal. The
              # running state is matched only against the states that mean
              # broken, because the ones that mean fine are a list Azure is
              # free to add to: requiring the literal "Running" failed a deploy
              # whose revision was serving perfectly as "RunningAtMaxScale",
              # which is a scaling detail and not a verdict.
              if [ "$state" = "Provisioned" ] && [ "$image" = "$expected" ]; then
                echo "Revision ${name} is provisioned on the image this run pushed (${running:-state unreported})."
                exit 0
              fi

              sleep 15
            done

            echo "::error::Revision did not reach Running with the pushed image within ten minutes."
            exit 1

      # Step 7: Azure Logout
      - name: Logout from Azure
        run: az logout

  # The CDN edge-caches HTML (a cache rule in the Cloudflare dashboard, with
  # the edge TTL overriding the origin's no-cache), so a deploy must purge or
  # the edge keeps serving the previous release's pages. Purge-everything
  # rather than a URL list: the prerendered page set changes as guides are
  # added, and the assets are content-hashed so over-purging costs one cache
  # miss each, not correctness.
  purge-edge-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Block: one curl to one host.
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443

      - name: Purge Cloudflare cache
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          if [ -z "$ZONE_ID" ] || [ -z "$API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ZONE_ID / CLOUDFLARE_PURGE_TOKEN not set. The edge caches HTML with a TTL that overrides the origin, so without a purge this deploy would keep serving the previous release. Failing rather than warning: a deploy nobody can see the result of is not a deploy."
            exit 1
          fi
          curl --silent --show-error --fail -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  # The gate that was missing. Everything above proves the pipeline ran; this
  # proves the site answers. Liveness says the process is serving, readiness
  # says the databases it was configured with are reachable, and the two pages
  # confirm the SPA shell and a prerendered route both render — the failure
  # mode that once shipped an empty shell to every path.
  #
  # After the purge, so it reads what a visitor reads rather than a cached copy.
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: purge-edge-cache
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Block: one host, the site itself.
          egress-policy: block
          allowed-endpoints: >
            abera.tech:443

      - name: Check the deployed site answers
        env:
          SITE: https://abera.tech
        run: |
          set -uo pipefail
          failed=0

          check() {
            local path="$1" expected="$2" attempt code
            for attempt in $(seq 1 5); do
              code=$(curl --silent --show-error --location --max-time 20 \
                --output /dev/null --write-out '%{http_code}' "${SITE}${path}" || echo 000)
              if [ "${code}" = "${expected}" ]; then
                echo "  ${path} -> ${code}"
                return 0
              fi
              echo "  ${path} -> ${code} (attempt ${attempt}/5)"
              sleep 10
            done
            echo "::error::${SITE}${path} answered ${code}, expected ${expected}."
            failed=1
          }

          check /healthz 200
          check /readyz 200
          check / 200
          check /fitness 200
          check /robots.txt 200
          check /sitemap.xml 200
          check /.well-known/security.txt 200

          # A probe answered from the edge cache is not a probe. On
          # 2026-09-21 /healthz came back with an age of 83,725 seconds. The
          # origin says no-store; the cache rule in the Cloudflare dashboard
          # must exclude the probes and /api as well, because its edge TTL
          # overrides the origin. Two fetches: the second is what a monitor
          # sees, and it must not be a HIT.
          probe() {
            local path="$1" headers
            curl --silent --show-error --max-time 20 --output /dev/null "${SITE}${path}" || true
            headers=$(curl --silent --show-error --max-time 20 --output /dev/null \
              --dump-header - "${SITE}${path}" | tr -d '\r' | tr '[:upper:]' '[:lower:]')
            if ! grep -q '^cache-control: no-store' <<<"${headers}"; then
              echo "::error::${SITE}${path} does not carry Cache-Control: no-store; the deployed revision is not the one this workflow built."
              failed=1
            fi
            if grep -q '^cf-cache-status: hit' <<<"${headers}"; then
              echo "::error::${SITE}${path} is served from the edge cache. Exclude /healthz, /readyz and /api/* from the cache rule in the Cloudflare dashboard; a cached probe cannot see an outage."
              failed=1
            fi
            echo "  ${path} -> not cached"
          }

          probe /healthz
          probe /readyz

          # Mapped unconditionally and fetched by the carrier reviewing the
          # A2P campaign, so they must answer on any deployment.
          check /sms-terms 200
          check /sms-privacy 200

          # A path the router does not know must 404 rather than serve a shell.
          check /this-route-does-not-exist 404

          exit "${failed}"
