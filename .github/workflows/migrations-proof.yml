name: Migrations proof (temporary)
# Proves the deploy workflow's migrate job before it reaches master: this pull
# request's image, signed in as abera-migrator through a federated credential
# for pull requests, lists the pending production migrations and applies
# nothing. A second run with a role that does not exist must fail the step.
# The file and the pull_request credential are removed before the merge.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build --target final --file aberaTech.Server/Dockerfile --tag aberatech-migrations-proof .

      - name: Azure Login, migrator identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.DATABASE_MIGRATOR_CLIENT_ID }}
          tenant-id: ${{ secrets.ABERATECHSERVERAPP202412211749_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Pending migrations, as abera-migrator
        run: ./scripts/migrate-production.sh aberatech-migrations-proof list

      - name: A role that does not exist fails the step
        run: |
          if MIGRATOR_ROLE=abera-nobody ./scripts/migrate-production.sh aberatech-migrations-proof list; then
            echo "::error::a refused sign-in exited 0"
            exit 1
          fi
          echo "refused sign-in failed the step, as it must"

      - name: Logout from Azure
        if: always()
        run: az logout || true
