# The gate for the whole repository: the client, its style, and the scheduling
# feature on the server.
#
# Each job builds a stage of the same Dockerfile a developer builds locally with
# `make check`, so a green run here means the code passed on the same node and
# the same SDK it passed on at the laptop. Nothing is installed on the runner
# but Docker.
#
# Separate jobs rather than steps in one, so a red X names which part of the
# repository broke without anybody opening the log.
name: Checks

on:
  # Every pull request, whatever it targets. Filtering on master meant a pull
  # request stacked on another feature branch got no checks at all, so the one
  # kind of change most likely to go wrong — the one built on top of unmerged
  # work — was the one nothing verified.
  pull_request:
  # If a merge queue is ever enabled, required checks must run on the queued
  # merge group or every merge waits forever. Harmless while no queue exists.
  merge_group:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-tests:
    name: Type check and unit tests, in the container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; don't leave the token on disk for every
          # later step and child process to read.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL to run steps, so the
      # CLI build below can keep using the same type=gha cache scope the
      # docker/build-push-action step used before it.
      - name: Expose GitHub runtime for the buildx cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Builds only the stages the target needs, so this never builds the
      # .NET server or the final image. A CLI build rather than
      # docker/build-push-action so the test output lands in a file the
      # summary step below can parse — same builder, same gha cache scope.
      - name: Build the client test stage
        run: |
          set -o pipefail
          docker buildx build \
            --file aberaTech.Server/Dockerfile \
            --target clienttest \
            --cache-from type=gha,scope=clienttest \
            --cache-to type=gha,scope=clienttest,mode=max \
            --progress plain \
            . 2>&1 | tee clienttest-build.log

      # Parses the vitest summary and coverage lines already in the build
      # log — never re-runs tests. vitest colors its summary even without a
      # TTY, so ANSI escapes are stripped before matching. Guarded so a
      # missing line (e.g. a fully cached stage) degrades to no summary
      # rather than a red job.
      - name: Append test totals to the job summary
        run: |
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          sed 's/\x1b\[[0-9;]*m//g' clienttest-build.log > clienttest-build.clean
          tests=$(grep -Eo 'Tests[[:space:]]+[0-9]+ passed' clienttest-build.clean | grep -Eo '[0-9]+' | tail -1)
          files=$(grep -Eo 'Test Files[[:space:]]+[0-9]+ passed' clienttest-build.clean | grep -Eo '[0-9]+' | tail -1)
          lines=$(grep -Eo 'Lines[[:space:]]*:[[:space:]]*[0-9.]+%' clienttest-build.clean | tail -1 | grep -Eo '[0-9.]+')
          [ -n "${tests:-}" ] || exit 0
          {
            echo "### Client: type check + unit tests (container)"
            echo ""
            echo "| Tests passed | Test files | Line coverage |"
            echo "| --- | --- | --- |"
            echo "| ${tests} | ${files:-?} | ${lines:-?}% |"
          } >> "$GITHUB_STEP_SUMMARY"

  compose-db:
    name: Compose database boots healthy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What a developer's `make up` does first, on a fresh volume — because
      # nothing else in CI ever booted the compose database, the automerged
      # postgres:18 bump shipped green while breaking every local `make up`
      # (18 moved its data directory and refuses a volume at the old path,
      # docker-library/postgres#1259). Cheap on purpose: no app build, just
      # the database reaching its own healthcheck.
      - name: Boot the compose database to healthy
        run: |
          docker compose up -d db
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' aberatech-db-1 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "database healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::compose db never reached healthy; a db image bump likely broke local dev"
          docker logs aberatech-db-1 || true
          exit 1

  style:
    name: Lint and format, in the container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Biome lives in the root package and reads biome.json beside it. The
      # build context is the repository root, so the clientlint stage has all
      # of it.
      - name: Build the client lint stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: clientlint
          push: false
          load: false
          cache-from: type=gha,scope=clientlint
          cache-to: type=gha,scope=clientlint,mode=max

  scheduling-tests:
    name: Scheduling unit tests, in the container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL to run steps, so the
      # CLI build below can keep using the same type=gha cache scope the
      # docker/build-push-action step used before it.
      - name: Expose GitHub runtime for the buildx cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The daylight saving arithmetic, the queue projection and the delivery
      # retry schedule. Its own job rather than a step on the client one, so a
      # failure names which half of the repository broke. A CLI build rather
      # than docker/build-push-action so the test output lands in a file the
      # summary step below can parse — same builder, same gha cache scope.
      - name: Build the scheduling test stage
        run: |
          set -o pipefail
          docker buildx build \
            --file aberaTech.Server/Dockerfile \
            --target servertest \
            --cache-from type=gha,scope=servertest \
            --cache-to type=gha,scope=servertest,mode=max \
            --progress plain \
            . 2>&1 | tee servertest-build.log

      # Parses the test-runner summary and the coverage line the servertest
      # stage prints — never re-runs tests. ANSI escapes are stripped before
      # matching. Guarded so a missing line (e.g. a fully cached stage)
      # degrades to no summary rather than a red job.
      - name: Append test totals to the job summary
        run: |
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          sed 's/\x1b\[[0-9;]*m//g' servertest-build.log > servertest-build.clean
          passed=$(grep -Eo 'Passed:[[:space:]]+[0-9]+' servertest-build.clean | grep -Eo '[0-9]+' | tail -1)
          failed=$(grep -Eo 'Failed:[[:space:]]+[0-9]+' servertest-build.clean | grep -Eo '[0-9]+' | tail -1)
          coverage=$(grep -Eo 'server line coverage: [0-9.]+%' servertest-build.clean | grep -Eo '[0-9.]+%' | tail -1)
          [ -n "${passed:-}" ] || exit 0
          {
            echo "### Scheduling: unit tests (container)"
            echo ""
            echo "| Passed | Failed | Line coverage |"
            echo "| --- | --- | --- |"
            echo "| ${passed} | ${failed:-0} | ${coverage:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"

  production-image:
    name: Production image, in the container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The stage the deploy workflow builds on push to master, built here
      # first. The test and lint stages never run `npm run build` or
      # `dotnet publish`, so without this job a change could pass every test
      # and still break the production build — with the deploy to the live
      # site as the first place it failed.
      #
      # load: true (unlike the other build jobs) so the assertion below can
      # inspect the image's runtime config.
      - name: Build the production image stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: final
          push: false
          load: true
          tags: aberatech-ci-final
          cache-from: type=gha,scope=final
          cache-to: type=gha,scope=final,mode=max

      # The Dockerfile drops privileges with USER $APP_UID; a base-image
      # change (or a refactor that reorders the final stage) could silently
      # revert the container to root and CI would stay green. Assert the
      # image's configured user is a real non-root user.
      - name: Assert the production image runs as non-root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' aberatech-ci-final)
          echo "image runs as user: '${user}'"
          case "$user" in
            ""|0|root|0:*|root:*)
              echo "::error::production image runs as root (Config.User='${user}')"
              exit 1
              ;;
          esac

  # Lint the linters: the workflows and shell scripts every other gate is
  # built out of get no checks from the app toolchain, so a typo'd `if:` or
  # an unquoted variable in a script fails silently until it matters.
  # actionlint validates the workflow files (delegating embedded run: blocks
  # to shellcheck); shellcheck covers scripts/*.sh. Both binaries are
  # version- and checksum-pinned so this job runs exactly what was reviewed.
  lint:
    name: lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # checkout dials github.com; the two release tarballs redirect to
          # the githubusercontent asset hosts.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned actionlint and shellcheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          curl -fsSLo shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: actionlint (workflows, including embedded shell)
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck "$RUNNER_TEMP/shellcheck"'

      - name: shellcheck (scripts/*.sh)
        run: '"$RUNNER_TEMP/shellcheck" scripts/*.sh'

      # The ruleset's required contexts live in .github/required-contexts.txt;
      # this fails when that list and the PR-gating job names drift apart.
      - name: Required contexts match the PR-gating workflows
        run: ./scripts/check-required-contexts.sh
