# The gate for the whole repository: the client, its style, and the scheduling
# feature on the server.
#
# Each job builds a stage of the same Dockerfile a developer builds locally with
# `make check`, so a green run here means the code passed on the same node and
# the same SDK it passed on at the laptop. Nothing is installed on the runner
# but Docker.
#
# Three jobs rather than three steps in one, so a red X names which part of the
# repository broke without anybody opening the log.
name: Checks

on:
  # Every pull request, whatever it targets. Filtering on master meant a pull
  # request stacked on another feature branch got no checks at all, so the one
  # kind of change most likely to go wrong — the one built on top of unmerged
  # work — was the one nothing verified.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-tests:
    name: Type check and unit tests, in the container
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Builds only the stages the target needs, so this never builds the
      # .NET server or the final image.
      - name: Build the client test stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: clienttest
          push: false
          load: false
          cache-from: type=gha,scope=clienttest
          cache-to: type=gha,scope=clienttest,mode=max

  compose-db:
    name: Compose database boots healthy
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What a developer's `make up` does first, on a fresh volume — because
      # nothing else in CI ever booted the compose database, the automerged
      # postgres:18 bump shipped green while breaking every local `make up`
      # (18 moved its data directory and refuses a volume at the old path,
      # docker-library/postgres#1259). Cheap on purpose: no app build, just
      # the database reaching its own healthcheck.
      - name: Boot the compose database to healthy
        run: |
          docker compose up -d db
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' aberatech-db-1 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "database healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::compose db never reached healthy; a db image bump likely broke local dev"
          docker logs aberatech-db-1 || true
          exit 1

  style:
    name: Lint and format, in the container
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Biome lives in the root package and reads biome.json beside it. The
      # build context is the repository root, so the clientlint stage has all
      # of it.
      - name: Build the client lint stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: clientlint
          push: false
          load: false
          cache-from: type=gha,scope=clientlint
          cache-to: type=gha,scope=clientlint,mode=max

  scheduling-tests:
    name: Scheduling unit tests, in the container
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The daylight saving arithmetic, the queue projection and the delivery
      # retry schedule. Its own job rather than a step on the client one, so a
      # failure names which half of the repository broke.
      - name: Build the scheduling test stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: servertest
          push: false
          load: false
          cache-from: type=gha,scope=servertest
          cache-to: type=gha,scope=servertest,mode=max
