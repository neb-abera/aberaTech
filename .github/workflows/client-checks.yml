# The gate for the whole repository: the client, its style, and the scheduling
# feature on the server.
#
# Each job builds a stage of the same Dockerfile a developer builds locally with
# `make check`, so a green run here means the code passed on the same node and
# the same SDK it passed on at the laptop. Nothing is installed on the runner
# but Docker.
#
# Three jobs rather than three steps in one, so a red X names which part of the
# repository broke without anybody opening the log.
name: Checks

on:
  # Every pull request, whatever it targets. Filtering on master meant a pull
  # request stacked on another feature branch got no checks at all, so the one
  # kind of change most likely to go wrong — the one built on top of unmerged
  # work — was the one nothing verified.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-tests:
    name: Type check and unit tests, in the container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds only the stages the target needs, so this never builds the
      # .NET server or the final image.
      - name: Build the client test stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: clienttest
          push: false
          load: false
          cache-from: type=gha,scope=clienttest
          cache-to: type=gha,scope=clienttest,mode=max

  style:
    name: Lint and format, in the container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # eslint, typescript-eslint and prettier live in the root package and read
      # their config from beside it. The build context is the repository root,
      # so the clientlint stage has all of it.
      - name: Build the client lint stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: clientlint
          push: false
          load: false
          cache-from: type=gha,scope=clientlint
          cache-to: type=gha,scope=clientlint,mode=max

  scheduling-tests:
    name: Scheduling unit tests, in the container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The daylight saving arithmetic, the queue projection and the delivery
      # retry schedule. Its own job rather than a step on the client one, so a
      # failure names which half of the repository broke.
      - name: Build the scheduling test stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: servertest
          push: false
          load: false
          cache-from: type=gha,scope=servertest
          cache-to: type=gha,scope=servertest,mode=max
