# The gate for the whole repository: the client, its style, the server, and
# the site end to end in a browser.
#
# Each job builds a stage of the same Dockerfile a developer builds locally with
# `make check`, so a green run here means the code passed on the same node and
# the same SDK it passed on at the laptop. Nothing is installed on the runner
# but Docker.
#
# Separate jobs rather than steps in one, so a red X names which part of the
# repository broke without anybody opening the log.
name: Checks

on:
  # Every pull request, whatever it targets. Filtering on master meant a pull
  # request stacked on another feature branch got no checks at all, so the one
  # kind of change most likely to go wrong — the one built on top of unmerged
  # work — was the one nothing verified.
  pull_request:
  # If a merge queue is ever enabled, required checks must run on the queued
  # merge group or every merge waits forever. Harmless while no queue exists.
  merge_group:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request makes the running check obsolete. A newer
# push to the default branch does not: cancelling it left a merge commit
# with no checks and no scan (aberaTech #169, 2026-09-18).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-tests:
    name: Type check and unit tests, in the container
    runs-on: ubuntu-latest
    # A secret cannot be used in `if:` directly, so it is routed through
    # job-level env for the Codecov step below.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; don't leave the token on disk for every
          # later step and child process to read.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL to run steps, so the
      # CLI build below can keep using the same type=gha cache scope the
      # docker/build-push-action step used before it.
      - name: Expose GitHub runtime for the buildx cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Builds only the stages the target needs, so this never builds the
      # .NET server or the final image. A CLI build rather than
      # docker/build-push-action so the test output lands in a file the
      # summary step below can parse — same builder, same gha cache scope.
      - name: Build the client test stage
        run: |
          set -o pipefail
          docker buildx build \
            --file aberaTech.Server/Dockerfile \
            --target clienttest \
            --cache-from type=gha,scope=clienttest \
            --cache-to type=gha,scope=clienttest,mode=max \
            --load --tag aberatech-clienttest \
            --progress plain \
            . 2>&1 | tee clienttest-build.log

      # Parses the vitest summary and coverage lines already in the build
      # log — never re-runs tests. vitest colors its summary even without a
      # TTY, so ANSI escapes are stripped before matching. Guarded so a
      # missing line (e.g. a fully cached stage) degrades to no summary
      # rather than a red job.
      - name: Append test totals to the job summary
        run: |
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          sed 's/\x1b\[[0-9;]*m//g' clienttest-build.log > clienttest-build.clean
          # `|| true`: the runner shell is bash -e, and a fully cached build
          # stage replays no test output — a no-match grep must fall through
          # to the guard below, not fail the step.
          tests=$(grep -Eo 'Tests[[:space:]]+[0-9]+ passed' clienttest-build.clean | grep -Eo '[0-9]+' | tail -1 || true)
          files=$(grep -Eo 'Test Files[[:space:]]+[0-9]+ passed' clienttest-build.clean | grep -Eo '[0-9]+' | tail -1 || true)
          lines=$(grep -Eo 'Lines[[:space:]]*:[[:space:]]*[0-9.]+%' clienttest-build.clean | tail -1 | grep -Eo '[0-9.]+' || true)
          [ -n "${tests:-}" ] || exit 0
          {
            echo "### Client: type check + unit tests (container)"
            echo ""
            echo "| Tests passed | Test files | Line coverage |"
            echo "| --- | --- | --- |"
            echo "| ${tests} | ${files:-?} | ${lines:-?}% |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The lcov report the stage wrote (vitest.config.ts), lifted out of the
      # image the build just loaded. Dashboard only: the blocking floors are
      # vitest's own thresholds, which failed the build above if crossed, so
      # the gate works with or without a Codecov account.
      - name: Coverage report out of the test image
        if: env.CODECOV_TOKEN != ''
        run: |
          set -euo pipefail
          id="$(docker create aberatech-clienttest)"
          docker cp "$id:/client/coverage/lcov.info" client-lcov.info
          docker rm "$id" > /dev/null

      - name: Upload coverage to Codecov (dashboard only, needs CODECOV_TOKEN)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: client-lcov.info
          flags: client
          token: ${{ secrets.CODECOV_TOKEN }}

  compose-db:
    name: Compose database boots healthy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What a developer's `make up` does first, on a fresh volume — because
      # nothing else in CI ever booted the compose database, the automerged
      # postgres:18 bump shipped green while breaking every local `make up`
      # (18 moved its data directory and refuses a volume at the old path,
      # docker-library/postgres#1259). Cheap on purpose: no app build, just
      # the database reaching its own healthcheck.
      - name: Boot the compose database to healthy
        run: |
          docker compose up -d db
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' aberatech-db-1 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "database healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::compose db never reached healthy; a db image bump likely broke local dev"
          docker logs aberatech-db-1 || true
          exit 1

      # The server tests that need a real Postgres: the queue's capability
      # rules, the rate limits on real endpoints, and the least-privilege
      # database roles. The hermetic servertest stage cannot reach a database
      # from inside `docker build` and skips them, so they run here, where the
      # database is already up. A step on this job rather than a job of its
      # own so the ruleset's required contexts stay as they are. The script
      # fails if nothing ran or anything skipped.
      - name: Database-backed server tests
        run: ./scripts/server-db-tests.sh

  style:
    name: Lint and format, in the container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution step below reads every commit this pull request
          # would add, and a shallow clone has no merge base to measure the
          # range from.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Biome lives in the root package and reads biome.json beside it. The
      # build context is the repository root, so the clientlint stage has all
      # of it.
      - name: Build the client lint stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: clientlint
          push: false
          load: false
          cache-from: type=gha,scope=clientlint
          cache-to: type=gha,scope=clientlint,mode=max

      # Dependabot only opens a pull request for a bump that installs, so a
      # major whose peer range the manifest cannot satisfy is never offered
      # and nothing goes red (openapi-typescript sat at 6 for two years that
      # way in two sibling repositories). A `docker run`, not a build stage:
      # the answer depends on the registry, and a cached layer would never
      # ask again. The self-test runs first, every time, so a check that can
      # no longer fail is caught. A step on this job rather than a job of its
      # own so the ruleset's required contexts stay as they are.
      - name: No dependency is held behind a major that cannot install
        run: |
          set -euo pipefail
          ./scripts/check-held-majors.sh --self-test
          ./scripts/check-held-majors.sh

      # The writing rules (.vale/styles/Abera) over every tracked Markdown
      # file. The self-test runs first, every time: every rule must fire on
      # a fixture that carries one violation each, and a clean fixture must
      # pass, so a rule that has stopped matching is caught before it is
      # trusted. The prerendered pages get the same rules in the production
      # image job below, where the client build already exists.
      - name: Markdown passes the writing rules
        run: |
          set -euo pipefail
          ./scripts/check-prose.sh --self-test
          ./scripts/check-prose.sh

      # Nothing published under Neb's name credits an AI. The commit-msg hook
      # and the Claude PreToolUse gate both run on the machine making the
      # commit, so neither sees one made anywhere they are not installed. On
      # 2026-09-24 a branch cut from a pre-rewrite master merged and put 45
      # stripped lines back on master, which took a second rewrite and a force
      # push past the ruleset to undo. This runs where the merge happens.
      # A step on this job rather than a job of its own so the ruleset's
      # required contexts stay as they are.
      - name: No commit in this pull request credits an AI
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          ./scripts/check-attribution.sh --self-test
          ./scripts/check-attribution.sh "origin/${GITHUB_BASE_REF}..HEAD"

  scheduling-tests:
    name: Scheduling unit tests, in the container
    runs-on: ubuntu-latest
    # A secret cannot be used in `if:` directly, so it is routed through
    # job-level env for the Codecov step below.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL to run steps, so the
      # CLI build below can keep using the same type=gha cache scope the
      # docker/build-push-action step used before it.
      - name: Expose GitHub runtime for the buildx cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The daylight saving arithmetic, the queue projection and the delivery
      # retry schedule. Its own job rather than a step on the client one, so a
      # failure names which half of the repository broke. A CLI build rather
      # than docker/build-push-action so the test output lands in a file the
      # summary step below can parse — same builder, same gha cache scope.
      - name: Build the scheduling test stage
        run: |
          set -o pipefail
          docker buildx build \
            --file aberaTech.Server/Dockerfile \
            --target servertest \
            --cache-from type=gha,scope=servertest \
            --cache-to type=gha,scope=servertest,mode=max \
            --load --tag aberatech-servertest \
            --progress plain \
            . 2>&1 | tee servertest-build.log

      # Parses the one verdict line the servertest stage prints
      # (scripts/check-server-tests.sh): coverage, the counts, and how many
      # [PostgresFact] tests were deferred to the compose database — never
      # re-runs tests. ANSI escapes are stripped before matching. Guarded so
      # a missing line (e.g. a fully cached stage) degrades to no summary
      # rather than a red job.
      - name: Append test totals to the job summary
        run: |
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          sed 's/\x1b\[[0-9;]*m//g' servertest-build.log > servertest-build.clean
          # `|| true`: the runner shell is bash -e, and a fully cached build
          # stage replays no test output — a no-match grep must fall through
          # to the guard below, not fail the step.
          verdict=$(grep -E '^server line coverage: ' servertest-build.clean | tail -1 || true)
          [ -n "${verdict:-}" ] || exit 0
          field() { grep -Eo "$1" <<< "$verdict" | grep -Eo '[0-9.]+%?' | head -1 || true; }
          passed=$(field '[0-9]+ passed')
          failed=$(field '[0-9]+ failed')
          skipped=$(field '[0-9]+ skipped')
          deferred=$(field '[0-9]+ \[PostgresFact\]')
          coverage=$(field 'coverage: [0-9.]+%')
          {
            echo "### Server: unit tests (container)"
            echo ""
            echo "| Passed | Failed | Skipped | Deferred to Postgres | Line coverage |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| ${passed:-?} | ${failed:-?} | ${skipped:-?} | ${deferred:-?} | ${coverage:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The cobertura report the stage's coverlet run wrote, lifted out of the
      # image the build just loaded. Dashboard only: the blocking floor is
      # SERVER_COVERAGE_MIN in the Dockerfile, checked by
      # scripts/check-server-tests.sh before this image existed, so the gate
      # works with or without a Codecov account.
      - name: Coverage report out of the test image
        if: env.CODECOV_TOKEN != ''
        run: |
          set -euo pipefail
          id="$(docker create aberatech-servertest)"
          docker cp "$id:/src/aberaTech.Server.Tests/TestResults" server-test-results
          docker rm "$id" > /dev/null
          report="$(find server-test-results -name coverage.cobertura.xml | head -1)"
          [ -n "$report" ] || { echo "no cobertura report in the servertest image" >&2; exit 1; }
          cp "$report" server-cobertura.xml

      - name: Upload coverage to Codecov (dashboard only, needs CODECOV_TOKEN)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: server-cobertura.xml
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}

  production-image:
    name: Production image, in the container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The stage the deploy workflow builds on push to master, built here
      # first. The test and lint stages never run `npm run build` or
      # `dotnet publish`, so without this job a change could pass every test
      # and still break the production build — with the deploy to the live
      # site as the first place it failed.
      #
      # load: true (unlike the other build jobs) so the assertion below can
      # inspect the image's runtime config.
      - name: Build the production image stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: final
          push: false
          load: true
          tags: aberatech-ci-final
          cache-from: type=gha,scope=final
          cache-to: type=gha,scope=final,mode=max

      # Page weight, as bytes against scripts/page-budgets.json. A step here
      # rather than a job of its own: clientbudget sits on the clientbuild
      # stage the image above has just built, so this measures the bundle
      # that ships and costs one cached layer lookup plus the check. The
      # stage runs the checker's self-test first, which shows it failing on
      # an over-budget fixture before it is trusted to pass this build.
      - name: Check the page weight budgets
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: clientbudget
          push: false
          load: false
          cache-from: type=gha,scope=final

      # The same writing rules, on the prerendered HTML the image ships: the
      # guides are checked as a reader gets them, not as TypeScript strings.
      # Sits on clientbuild like the budget stage, so it costs one cached
      # layer lookup plus the lint.
      - name: Prerendered pages pass the writing rules
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: aberaTech.Server/Dockerfile
          target: clientprose
          push: false
          load: false
          cache-from: type=gha,scope=final

      # The Dockerfile drops privileges with USER $APP_UID; a base-image
      # change (or a refactor that reorders the final stage) could silently
      # revert the container to root and CI would stay green. Assert the
      # image's configured user is a real non-root user.
      - name: Assert the production image runs as non-root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' aberatech-ci-final)
          echo "image runs as user: '${user}'"
          case "$user" in
            ""|0|root|0:*|root:*)
              echo "::error::production image runs as root (Config.User='${user}')"
              exit 1
              ;;
          esac

  e2e:
    name: End-to-end, in the container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exactly what `make e2e` runs locally: the production image and its
      # database up through compose, and Playwright (in the image that matches
      # e2e/package.json) dialling the app over the compose network. The
      # delivery bugs that reach production are the ones nothing opened in a
      # browser: an uncompressed bundle, a cookie on an asset, a prerendered
      # page that is blank with JavaScript off.
      - name: Playwright against the production image
        run: make e2e

      # When the browser suite fails, the trace is how you see what it saw.
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: e2e-test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: App logs
        if: always()
        run: docker compose logs app 2>&1 | tail -40 || true

  # Lint the linters: the workflows and shell scripts every other gate is
  # built out of get no checks from the app toolchain, so a typo'd `if:` or
  # an unquoted variable in a script fails silently until it matters.
  # actionlint validates the workflow files (delegating embedded run: blocks
  # to shellcheck). shellcheck covers scripts/*.sh. Both come from the
  # digest-pinned `actionlint` stage of aberaTech.Server/Dockerfile, the one
  # place their version is written, and `make lint-ci` runs them there.
  lint:
    name: lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job runs containers, and container-side
          # DNS bypasses the resolver harden-runner watches. The image layers
          # come from storage hosts that change without notice.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (workflows, including embedded shell), shellcheck (scripts), workflow concurrency
        run: make lint-ci

      # The ruleset's required checks live in .github/required-checks. This
      # fails when that list and the PR-gating job names drift apart. The
      # self-test plants a renamed check, a lost trigger and an unlisted job.
      - name: Required checks match the PR-gating workflows
        run: |
          set -euo pipefail
          ./scripts/check-required-contexts.sh --self-test
          ./scripts/check-required-contexts.sh

      - name: Shared files match the template
        # The files .template-parity lists are byte-identical to
        # modern-webapp-template's default branch, or this fails. A change
        # to one of them lands in the template first. Reads the template's
        # files from raw.githubusercontent.com. The self-test
        # runs first, every time: it plants a drifted and a missing file
        # against a local fixture template and must catch both, so a checker
        # that has stopped failing is caught before it is trusted.
        run: |
          set -euo pipefail
          ./scripts/check-template-parity.sh --self-test
          ./scripts/check-template-parity.sh
