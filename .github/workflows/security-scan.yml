# Known-CVE search inside the production image, on every pull request and
# weekly — new CVEs are published against images that have not changed.
# ignore-unfixed skips distro findings Debian has no patch for; everything
# actionable fails the check and lands in the Security tab.
name: Security scan

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "45 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:  image-scan:
    name: container scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
# Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: docker build -f aberaTech.Server/Dockerfile --target final -t scan-target .

      - name: Scan for fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: scan-target
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          # SARIF output ignores the severity filter unless this is set,
          # which makes exit-code fire on LOW/MEDIUM noise.
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif

  # Flags known-vulnerable dependencies introduced by a PR, from the diff of
  # the dependency graph.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
          api.deps.dev:443
          api.securityscorecards.dev:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            index.docker.io:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            api.nuget.org:443
            globalcdn.nuget.org:443
            registry.npmjs.org:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            mirror.gcr.io:443

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dast:
    name: dast (ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Boot the production image against postgres
        run: |
          docker compose up -d --build db app
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/healthz > /dev/null 2>&1 && break || sleep 2
          done
          curl -sf http://localhost:8080/healthz > /dev/null

      - name: ZAP baseline scan
        # An attacker's-eye scan of the running production image. Accepted
        # findings live in .zap/rules.tsv with their reasoning.
        run: |
          docker run --rm --network host -v "$PWD/.zap":/zap/wrk:ro \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv

      - name: App logs
        if: always()
        run: docker compose logs app 2>&1 | tail -40 || true
